name: grove_crdt
description: Dart client for Grove's CRDT sync protocol. Hybrid logical clocks, LWW registers, counters, sets, lists, documents, text, presence, rooms, undo, and HTTP, SSE and WebSocket transports.
version: 1.0.0
repository: https://github.com/xraph/grove/tree/main/crdt-dart

environment:
  sdk: ^3.13.0

dependencies:
  collection: ^1.19.1
  http: ^1.6.0
  meta: ^1.19.0
  web: ^1.1.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  fake_async: ^1.3.3
  lints: ^6.1.0
  shelf: ^1.4.2
  test: ^1.32.0
