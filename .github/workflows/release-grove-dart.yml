name: Release Grove Dart

# Publishes grove_crdt (crdt-dart/) to pub.dev. You can start it two ways.
#
# Dispatch it from main, which is the usual one:
#
#   gh workflow run release-grove-dart.yml --ref main -f version=1.2.0
#
# If version is newer than crdt-dart/pubspec.yaml, the run bumps the pubspec,
# adds a CHANGELOG.md entry and commits both to main as github-actions[bot].
# Pass -f changelog='...' to write the entry yourself. Without it, the entry
# lists the commits that touched crdt-dart/lib since the last release, or says
# there were none. A heading for the version that's already in CHANGELOG.md is
# kept as written. Leave version out to release whatever the pubspec says.
# dry_run makes the bump locally, runs the checks and stops, so nothing is
# pushed.
#
# Or bump the pubspec and CHANGELOG on main yourself and push a tag named
# grove_crdt-v<version>:
#
#   git tag grove_crdt-v1.2.0 && git push origin grove_crdt-v1.2.0
#
# Either way, the upload happens in a run on the tag. pub.dev only trusts the
# GitHub OIDC token of a run whose ref is a tag matching grove_crdt-v{{version}},
# and it compares that tag with the version inside the package, so the bump has
# to be committed before the tag exists. A dispatch from main runs every check
# on the bump commit first. Then a second job pushes that exact commit to main,
# tags it and dispatches this workflow again on the tag. The push only
# fast-forwards, so if main moved during the run it fails before anything is
# tagged. A tag created with GITHUB_TOKEN doesn't start any workflow, which is
# why it dispatches instead of waiting for the push. The write token lives in
# that second job only, away from the job that runs pub packages and tests.
#
# There is no token to store. You set up automated publishing in the package's
# admin page on pub.dev: repository xraph/grove, tag pattern
# grove_crdt-v{{version}}, environment pub.dev, with both the push and the
# workflow_dispatch events ticked. If workflow_dispatch isn't ticked, the run on
# the tag fails at the upload, and you can re-run it once it is. pub.dev only
# lets you turn automated publishing on for a package that already exists,
# which is why 1.0.0 was published by hand.
#
# A tag run for a version that is already on pub.dev (1.0.0, for one) runs the
# checks and skips the upload, so re-running one is safe. A dispatch from main
# fails for a version that's already published, and for one lower than the
# pubspec.

on:
  push:
    tags:
      - 'grove_crdt-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.0. A version newer than crdt-dart/pubspec.yaml is bumped and committed to main. Leave empty to release the pubspec version.'
        required: false
        type: string
      changelog:
        description: 'CHANGELOG.md entry for a bumped version. Leave empty to list the commits that touched crdt-dart/lib since the last release.'
        required: false
        type: string
      dry_run:
        description: 'Run the checks without committing, tagging or publishing'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify grove_crdt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      bump: ${{ steps.version.outputs.bump }}
      commit: ${{ steps.bump.outputs.commit || github.sha }}
      publish: ${{ steps.version.outputs.publish }}
      release: ${{ steps.version.outputs.release }}
    env:
      # The conformance tests build crdt-dart/tool/conformance_server with
      # GOWORK=off and GOPROXY=off, so the module cache must be warm first.
      GOWORK: 'off'
    defaults:
      run:
        working-directory: crdt-dart
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # A generated changelog entry lists the commits since the last
          # grove_crdt tag, so the run needs the history and the tags.
          fetch-depth: 0

      # bump: the requested version is newer than the pubspec, so this run
      # commits the bump locally and the tag job pushes it.
      # publish: this run is on the tag and uploads to pub.dev.
      # release: this run is a dispatch from the default branch and hands off
      # to a new run on the tag.
      - name: Resolve the version
        id: version
        env:
          WANT: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          current=$(sed -n 's/^version: *//p' pubspec.yaml)
          want="${WANT#v}"
          version="${want:-$current}"
          tag="grove_crdt-v$version"
          bump=false

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$version" != "$current" ]; then
              echo "::error::asked for $version, but crdt-dart/pubspec.yaml at $GITHUB_REF_NAME is $current"
              exit 1
            fi
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match pubspec version $current"
              exit 1
            fi
          else
            if [ "$DRY_RUN" != true ] && [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "::error::releases are tagged from $DEFAULT_BRANCH. Dispatch on $DEFAULT_BRANCH, or set dry_run to only check $GITHUB_REF_NAME."
              exit 1
            fi
            if [ "$version" != "$current" ]; then
              if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
                echo "::error::$version is not a semantic version, e.g. 1.2.0 or 1.2.0-beta.1"
                exit 1
              fi
              # Only x.y.z is compared, so 1.2.0 can follow 1.2.0-beta.1.
              lowest=$(printf '%s\n%s\n' "${current%%[-+]*}" "${version%%[-+]*}" | sort -V | head -n1)
              if [ "$lowest" != "${current%%[-+]*}" ]; then
                echo "::error::$version is lower than the pubspec version $current"
                exit 1
              fi
              bump=true
            fi
          fi

          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pub.dev/api/packages/grove_crdt/versions/$version")
          case "$status" in
            200) published=true ;;
            404) published=false ;;
            *)
              echo "::error::pub.dev answered $status for grove_crdt $version"
              exit 1 ;;
          esac

          publish=false
          release=false
          if [ "$published" = true ]; then
            if [ "$GITHUB_REF_TYPE" = branch ] && [ "$DRY_RUN" != true ]; then
              echo "::error::grove_crdt $version is already on pub.dev. Pass a newer version to release."
              exit 1
            fi
            echo "::notice::grove_crdt $version is already on pub.dev, so this run only checks it"
          elif [ "$DRY_RUN" = true ]; then
            echo "::notice::dry run, so grove_crdt $version is checked and not released"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            publish=true
          else
            # Without a bump, the tag may exist already from a dispatch whose
            # hand-off failed. That is fine at this commit and an error
            # anywhere else. With a bump, the commit doesn't exist yet, so any
            # existing tag is an error. ls-remote prints the peeled commit last
            # for an annotated tag.
            existing=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | tail -n1 | cut -f1)
            if [ -n "$existing" ] && { [ "$bump" = true ] || [ "$existing" != "$GITHUB_SHA" ]; }; then
              echo "::error::$tag already exists at $existing"
              exit 1
            fi
            release=true
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "bump=$bump"
            echo "publish=$publish"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

      # Committed before the checks so the publish dry run sees the new
      # version, its CHANGELOG entry and a clean git tree.
      - name: Commit the version bump
        id: bump
        if: steps.version.outputs.bump == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ inputs.changelog }}
        run: |
          sed -i "s/^version: .*/version: $VERSION/" pubspec.yaml

          if grep -Fqx "## $VERSION" CHANGELOG.md; then
            echo "::notice::CHANGELOG.md already has an entry for $VERSION, so it is kept as written"
          else
            if [ -z "$NOTES" ]; then
              last=$(git describe --tags --abbrev=0 --match 'grove_crdt-v*' 2>/dev/null || true)
              range=HEAD
              [ -z "$last" ] || range="$last..HEAD"
              NOTES=$(git log --no-merges --format='- %s' "$range" -- lib)
              if [ -z "$NOTES" ]; then
                NOTES="- No changes to the client library${last:+ since ${last#grove_crdt-v}}."
              fi
            elif [ "${NOTES#-}" = "$NOTES" ]; then
              NOTES="- $NOTES"
            fi
            { printf '## %s\n\n%s\n\n' "$VERSION" "$NOTES"; cat CHANGELOG.md; } > CHANGELOG.md.new
            mv CHANGELOG.md.new CHANGELOG.md
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "chore(crdt): release grove_crdt $VERSION"
          git show --stat HEAD
          git bundle create "$RUNNER_TEMP/bump.bundle" "$GITHUB_SHA..HEAD"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache: true
          cache-dependency-path: |
            go.sum
            crdt-dart/tool/conformance_server/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: crdt-dart/.fvmrc
          cache: true

      - name: Download Go modules for the conformance server
        working-directory: crdt-dart/tool/conformance_server
        run: go mod download

      - name: Resolve
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test

      - name: Publish dry run
        run: dart pub publish --dry-run

      - name: Hand the bump commit to the tag job
        if: steps.version.outputs.release == 'true' && steps.version.outputs.bump == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: grove-crdt-bump
          path: ${{ runner.temp }}/bump.bundle
          retention-days: 1
          if-no-files-found: error

  tag:
    name: Tag and start the publish run
    needs: verify
    if: needs.verify.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the bump commit and create the tag
      actions: write # dispatch this workflow on the tag
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
      COMMIT: ${{ needs.verify.outputs.commit }}
    steps:
      - name: Checkout
        if: needs.verify.outputs.bump == 'true'
        uses: actions/checkout@v6

      - name: Download the bump commit
        if: needs.verify.outputs.bump == 'true'
        uses: actions/download-artifact@v6
        with:
          name: grove-crdt-bump
          path: ${{ runner.temp }}

      - name: Push the bump commit
        if: needs.verify.outputs.bump == 'true'
        run: |
          git fetch -q "$RUNNER_TEMP/bump.bundle" HEAD
          fetched=$(git rev-parse FETCH_HEAD)
          if [ "$fetched" != "$COMMIT" ]; then
            echo "::error::the bundle holds $fetched, but the verified commit is $COMMIT"
            exit 1
          fi
          # A plain push only fast-forwards. If main moved during the run,
          # this fails and nothing gets tagged.
          git push origin "$COMMIT:refs/heads/$GITHUB_REF_NAME"

      - name: Create the tag
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "::notice::$TAG already points at this commit, so it is reused"
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$COMMIT" --silent
          fi

      - name: Start the publish run on the tag
        run: |
          gh workflow run release-grove-dart.yml --ref "$TAG" -f version="$VERSION"
          echo "Started the publish run for $TAG: $GITHUB_SERVER_URL/$GH_REPO/actions/workflows/release-grove-dart.yml" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to pub.dev
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
    with:
      environment: pub.dev
      working-directory: crdt-dart
